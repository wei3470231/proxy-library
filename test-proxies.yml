name: Test proxies (shard rotation)

# 24/7 proxy testing without the local VM's egress block.
# The local VM cannot open TCP to arbitrary proxy IP:port (other_tcp: Deny),
# and Ask would ask the user to confirm ~177,000 IPs one by one. This public
# repo's GitHub-hosted runners have unrestricted egress, and standard runners
# on public repos are free / unmetered, so the tester runs here instead.
#
# How it works:
# - The library is split into 36 shards (~4,900 proxies each at 177,810 lines).
# - One scheduled run tests ONE shard (10 threads, HTTP/HTTPS/SOCKS4/SOCKS5,
#   ipify exit-IP check, same contract as test_proxies.py) and commits only
#   that shard's result file: tested_working_shard_<N>.json.
# - A state file (tester_shard_state.json) records the next shard; it only
#   advances when a run finishes its shard, so a run cut short by the time
#   budget retries the same shard next time instead of skipping it.
# - Every 6 hours one shard is tested, so a full pass takes ~9 days, then
#   it loops from shard 0 again. After the pilot, raise throughput by
#   testing more shards per run (see README in this directory).
#
# First-time setup (one-off, by the repo owner):
# 1. Make sure proxies.txt in this repo is the CURRENT library (the file
#    pushed 2026-11-21 has 164,139 lines; the live library is 177,810).
#    Re-upload it from the workspace copy, or push it with a token.
# 2. Add this directory's two files to the repo:
#      .github/workflows/test-proxies.yml   (this file)
#      test_proxies_shard.py               (repo root)
#    No token is needed: the workflow pushes with the built-in GITHUB_TOKEN.
# 3. Check the Actions tab after the first run. The first run is a PILOT:
#    it tests shard 0 only, capped at 240 minutes, so we can measure real
#    speed and pass rate before committing to the full loop. A manual
#    dispatch can cap any run at fewer proxies (pilot_limit input).
# 4. Merge shard files into one working table with merge_shards.py
#    (workspace copy) whenever a table is needed for the space / download.

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard to test (blank = next from state file)"
        required: false
        default: ""
      pilot_limit:
        description: "Max proxies for this run (0 = whole shard)"
        required: false
        default: "500"

permissions:
  contents: write

env:
  SHARDS: "36"
  MAX_MINUTES: "240"

jobs:
  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests PySocks

      - name: Pick shard
        id: pick
        run: |
          if [ -n "${{ inputs.shard }}" ]; then
            echo "shard=${{ inputs.shard }}" >> "$GITHUB_OUTPUT"
          else
            SHARD=$(python3 -c "import json; print(json.load(open('tester_shard_state.json'))['next_shard'])" 2>/dev/null || echo 0)
            echo "shard=$SHARD" >> "$GITHUB_OUTPUT"
          fi
          echo "shard picked: $(cat $GITHUB_OUTPUT)"

      - name: Test shard
        # Exit 3 = time budget hit, shard incomplete but results are saved.
        # That is a normal outcome, not a job failure: keep going so the
        # partial results still get committed and the shard is retried.
        run: |
          LIMIT="${{ inputs.pilot_limit }}"
          if [ -z "$LIMIT" ]; then LIMIT=0; fi
          python3 test_proxies_shard.py \
            --library proxies.txt \
            --shards "$SHARDS" \
            --shard "${{ steps.pick.outputs.shard }}" \
            --max-minutes "$MAX_MINUTES" \
            --limit-proxies "$LIMIT" || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
          echo "tester exit=$code (0=shard done, 3=time budget, partial saved)"

      - name: Advance shard state (only if the shard finished)
        if: success()
        run: |
          python3 - <<'PY'
          import json, os
          shard = int(os.environ["SHARD"])
          shards = int(os.environ["SHARDS"])
          summary = json.load(open(f"tester_shard_{shard}_summary.json"))
          if summary.get("complete"):
              nxt = (shard + 1) % shards
              json.dump({"next_shard": nxt, "updated_at": summary["finished_at"]},
                        open("tester_shard_state.json", "w"))
              print(f"shard {shard} complete, next={nxt}")
          else:
              print(f"shard {shard} incomplete (time budget), will retry it next run")
          PY
        env:
          SHARD: ${{ steps.pick.outputs.shard }}
          SHARDS: ${{ env.SHARDS }}

      - name: Commit shard results
        run: |
          git config user.name "proxy-tester"
          git config user.email "proxy-tester@users.noreply.github.com"
          git add "tested_working_shard_${{ steps.pick.outputs.shard }}.json" \
                  "tester_shard_${{ steps.pick.outputs.shard }}_summary.json" \
                  tester_shard_state.json || true
          git diff --cached --quiet || git commit -m "test shard ${{ steps.pick.outputs.shard }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
